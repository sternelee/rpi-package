[package]
name = "rpi-mcp-adapter"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Session-scoped stdio and Streamable HTTP MCP adapter for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "mcp", "json-rpc", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { version = "0.3.16", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "net"] }
url = { workspace = true }
# MCP OAuth: PKCE needs SHA-256 + base64url, and the verifier/state need
# cryptographic randomness. All three are already in the workspace lock file.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
